name: Build Custom Patched Flutter Engine

on:
  workflow_dispatch:
    inputs:
      engine_hash:
        description: 'Exact Engine Commit Hash for 3.44.8'
        required: true
        default: '0cd610717bde95fd88343c64f81c11ba4e5c0010' 

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🧹 Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          remove-android: 'false'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git python3 pkg-config ninja-build

      - name: 🛠️ Setup Google Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: 📥 Fetch Flutter Engine Source
        run: |
          mkdir -p engine/src/flutter
          cd engine/src/flutter
          git init
          git remote add origin https://github.com/flutter/engine.git
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin --prune --progress
          git checkout ${{ github.event.inputs.engine_hash }}
          
          cd ../../
          cat <<EOF > .gclient
          solutions = [
            {
              "managed": False,
              "name": "src/flutter",
              "url": "https://github.com/flutter/engine.git",
              "custom_deps": {},
              "deps_file": "DEPS",
              "safesync_url": "",
            },
          ]
          EOF
          
          gclient sync -v --no-history -D

      - name: 🔓 Apply SSL Pinning Bypass Patch
        run: |
          cd engine/src/third_party/dart/runtime/bin
          sed -i 's/return ssl_verify_invalid;/return ssl_verify_ok;/g' security_context.cc
          if [ -f "security_context_linux.cc" ]; then
            sed -i 's/return ssl_verify_invalid;/return ssl_verify_ok;/g' security_context_linux.cc
          fi

      - name: ⚙️ Configure Build (GN)
        run: |
          cd engine/src
          ./flutter/tools/gn --android --android-cpu=arm64 --runtime-mode=release

      - name: 🔨 Compile Engine (Ninja)
        run: |
          cd engine/src
          ninja -C out/android_release_arm64 -j$(nproc)

      - name: 📤 Upload Patched libflutter.so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-libflutter-arm64
          path: engine/src/out/android_release_arm64/libflutter.so
