name: Build patched libflutter.so (Android arm64, release)

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter tag to target (must exist in flutter/flutter), e.g. 3.44.8"
        required: true
        default: "3.44.8"
      runtime_mode:
        description: "Engine runtime mode"
        required: true
        type: choice
        options: [release, profile]
        default: release

env:
  DEPOT_TOOLS_UPDATE: "0"
  WORK_DIR: ${{ github.workspace }}/flutter

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      
      # ---------------------------------------------------------------
      # 0. Free up disk (engine builds need ~40+ GB)
      # ---------------------------------------------------------------
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192  # 4096 se badha kar 8192 kar diya taaki apt-get fail na ho
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget python3 python3-pip python3-venv \
            build-essential ninja-build pkg-config \
            openjdk-17-jdk-headless unzip zip xz-utils \
            libgl1-mesa-dev libegl1-mesa-dev
          git config --global gc.auto 0

      # ---------------------------------------------------------------
      # 1. depot_tools
      # ---------------------------------------------------------------
      - name: Checkout depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      # ---------------------------------------------------------------
      # 2. Partial clone of flutter/flutter and checkout the tag.
      #    Engine source lives inside this repo at engine/src/flutter
      #    (monorepo layout) — no separate flutter/engine repo needed,
      #    no engine.version hash juggling, no ref errors.
      #    --filter=blob:none keeps the clone small (full history of
      #    blobs is NOT downloaded, only what the tag checkout needs).
      # ---------------------------------------------------------------
      - name: Clone flutter (partial) and checkout tag
        run: |
          TAG="${{ inputs.flutter_version }}"
          echo "Targeting Flutter tag: $TAG"

          git clone --filter=blob:none https://github.com/flutter/flutter.git "$WORK_DIR"
          cd "$WORK_DIR"

          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' not found. Valid tags: https://github.com/flutter/flutter/tags"
            exit 1
          fi
          git checkout "$TAG"
          echo "Checked out: $(git rev-parse HEAD)"
          test -f engine/scripts/standard.gclient || { echo "::error::monorepo engine/ layout not found at this tag"; exit 1; }

      - name: Disk usage after clone
        run: df -h /

            # ---------------------------------------------------------------
      # 3. .gclient at the repo root (monorepo standard config)
      # ---------------------------------------------------------------
      - name: Write .gclient
        working-directory: ${{ env.WORK_DIR }}
        run: |
          cat > .gclient <<'EOF'
          solutions = [
            {
              "custom_deps": {},
              "deps_file": "DEPS",
              "managed": False,
              "name": ".",
              "safesync_url": "",
              "url": "https://github.com/flutter/flutter.git",
              "custom_vars": {
                "download_emsdk": False,
                "download_fuchsia_deps": False,
                "download_ios_deps": False,
                "download_mac_deps": False,
                "download_windows_deps": False,
              },
            },
          ]
          EOF


            # ---------------------------------------------------------------
      # 4. gclient sync — retries built in for googlesource throttling
      # ---------------------------------------------------------------
      - name: gclient sync
        working-directory: ${{ env.WORK_DIR }}
        run: |
          git config --global http.postBuffer 524288000
          for attempt in 1 2 3 4; do
            echo "=== gclient sync attempt $attempt ==="
            # --retry-failed-fetch flag hata diya gaya hai
            if gclient sync \
                --nohooks \
                --verbose \
                --force \
                --reset \
                --shallow \
                -j4; then
              echo "gclient sync succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::gclient sync failed after 4 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed — waiting 90s before retry..."
            sleep 90
          done
          gclient runhooks


      # ---------------------------------------------------------------
      # 5. Free space: git history no longer needed after sync
      # ---------------------------------------------------------------
      - name: Free space — remove .git after sync
        working-directory: ${{ env.WORK_DIR }}
        run: |
          rm -rf .git
          df -h /

      # ---------------------------------------------------------------
      # 6. Patch BoringSSL: force certificate chain verification to OK
      # ---------------------------------------------------------------
      - name: Patch BoringSSL ssl_verify_cert_chain
        working-directory: ${{ env.WORK_DIR }}
        run: |
          python3 - <<'PYEOF'
          import re, sys, pathlib

          candidates = [
              "engine/src/flutter/third_party/boringssl/src/ssl/ssl_x509.cc",
              "engine/src/flutter/third_party/boringssl/src/ssl/ssl_cert.cc",
          ]

          fn_re = re.compile(
              r'(enum\s+ssl_verify_result_t\s+ssl_verify_cert_chain\s*\(\s*'
              r'SSL\s*\*\s*ssl\s*,\s*STACK_OF\(X509\)\s*\*\s*cert_chain\s*\)'
              r'[^{]*\{\s*)',
              re.MULTILINE,
          )

          patched = False
          for f in candidates:
              p = pathlib.Path(f)
              if not p.exists():
                  print(f"[skip] {f} not present")
                  continue
              src = p.read_text()
              m = fn_re.search(src)
              if not m:
                  print(f"[skip] ssl_verify_cert_chain not found in {f}")
                  continue
              if "ssl_bypass_patch" in src:
                  print(f"[skip] already patched: {f}")
                  patched = True
                  break
              new_src = src[:m.end(1)] + "\n  return ssl_verify_ok;  // ssl_bypass_patch\n" + src[m.end(1):]
              p.write_text(new_src)
              print(f"[ok] patched {f}")
              patched = True
              break

          if not patched:
              print("::error::Could not locate ssl_verify_cert_chain — "
                    "BoringSSL layout may have changed. Inspect "
                    "engine/src/flutter/third_party/boringssl/src/ssl/ and update paths.")
              sys.exit(1)
          PYEOF

      # ---------------------------------------------------------------
      # 7. GN + Ninja (build from engine/src in monorepo layout)
      # ---------------------------------------------------------------
      - name: GN (configure)
        working-directory: ${{ env.WORK_DIR }}/engine/src
        run: |
          ./flutter/tools/gn \
            --android \
            --android-cpu=arm64 \
            --runtime-mode=${{ inputs.runtime_mode }} \
            --no-lto

      - name: Ninja build libflutter.so
        working-directory: ${{ env.WORK_DIR }}/engine/src
        run: |
          ninja -C out/android_${{ inputs.runtime_mode }}_arm64
          df -h /

      # ---------------------------------------------------------------
      # 8. Upload artifact
      # ---------------------------------------------------------------
      - name: Upload libflutter.so
        uses: actions/upload-artifact@v4
        with:
          name: libflutter-android-arm64-${{ inputs.runtime_mode }}-${{ inputs.flutter_version }}
          path: ${{ env.WORK_DIR }}/engine/src/out/android_${{ inputs.runtime_mode }}_arm64/libflutter.so
          if-no-files-found: error
